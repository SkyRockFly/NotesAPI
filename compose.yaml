services:
    db:
      image: postgres:16
      environment:
        POSTGRES_PASSWORD: bear
        POSTGRES_DB: notedb
      ports:
        - "5432:5432"
      volumes:
        - "pgdata:/var/lib/postgresql/data"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5
        
    migrate:
      image: ghcr.io/kukymbr/goose-docker:3.24.3
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - ./migrations:/migrations
      entrypoint: ["goose", "-dir", "/migrations", "up"]
      environment:
        GOOSE_DRIVER: postgres
        GOOSE_DBSTRING: postgres://postgres:bear@db:5432/notedb?sslmode=disable
        GOOSE_MIGRATION_DIR: ./migrations
    app:
      build: .
      image: notesapp
      depends_on:
        db:
          condition: service_healthy
      ports:
        - "5680:5680"
      volumes:
        - ./configs/config.yaml:/app/configs/config.yaml

volumes:
  pgdata:
