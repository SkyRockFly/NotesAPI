services:
    db:
      image: postgres:16
      environment:
        POSTGRES_PASSWORD: bear
        POSTGRES_DB: notedb
      ports:
        - "5432:5432"
      volumes:
        - "pgdata:/var/lib/postgresql/data"
    migrate:
      image: ghcr.io/kukymbr/goose-docker:3.24.3
      depends_on:
        - db
      volumes:
        - ./migrations:/migrations
      entrypoint: ["goose", "-dir", "/migrations", "up"]
      environment:
        GOOSE_DRIVER: postgres
        GOOSE_DBSTRING: postgres://postgres:bear@db:5432/notedb?sslmode=disable
        GOOSE_MIGRATION_DIR: ./migrations
    app:
      build: .
      image: notesapp
      depends_on:
        - "db"
      ports:
        - "5680:5680"
      volumes:
        - ./configs/app.env:/app/configs/app.env

volumes:
  pgdata:
